id = "lichdotdev/lich-sessions"
name = "lich Sessions"
version = "0.3.0"
plugin_api = 43
author = "lichdotdev"
license = "MIT"
dependencies = ["lich", "git"]
tags = ["lich", "agents", "productivity"]
icon = "flame"
description = "Your lich sessions in the bar, a panel and on the desktop: who is working, who is waiting for you, one click to open its card."

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
height = 480
placement = "floating"
position = "center"

  [[panel.setting]]
  key = "order"
  type = "select"
  label_key = "settings.order.label"
  description_key = "settings.order.description"
  default = "attention"
  options = [
    { value = "attention", label_key = "settings.order.options.attention" },
    { value = "lich", label_key = "settings.order.options.lich" },
  ]

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "order"
  type = "select"
  label_key = "settings.order.label"
  description_key = "settings.order.description"
  default = "attention"
  options = [
    { value = "attention", label_key = "settings.order.options.attention" },
    { value = "lich", label_key = "settings.order.options.lich" },
  ]

  [[desktop_widget.setting]]
  key = "max_sessions"
  type = "int"
  label_key = "settings.max_sessions.label"
  description_key = "settings.max_sessions.description"
  default = 8
  min = 1
  max = 30
